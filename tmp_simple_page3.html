<!DOCTYPE html>
<html><head><style>
@page { size: 6in 9in; margin: 0; }

.template-title .page-safe-area { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.template-cover h1 { font-size: 36pt; margin-bottom: 12mm; text-transform: uppercase; }

.template-cover .status { font-size: 9pt; color: #8a93a3; }
h1, h2, h3, h4 { color: #c7cdd6; font-weight: 400; letter-spacing: 0.03em; margin-top: 0; }
</style></head><body>
