# Canonical exercise library for Ethan OS health/exercise model.
# Exercises reference canonical `equipment_type` IDs from `equipment-taxonomy.yaml`.

exercises:
  # Chest — horizontal push
  barbell_bench_press:
    title: Barbell Bench Press
    movement_pattern: horizontal_push
    primary_muscles: [chest]
    secondary_muscles: [triceps, shoulders]
    training_objectives: [strength, hypertrophy]
    required_equipment: [barbell, weight_plates, rack, bench]
    unilateral: false
    stability: free
    loading_potential: high
    isolation: false
    hypertrophy_suitability: high
    strength_suitability: high
    substitutes:
      - exercise_id: smith_machine_bench_press
        rank: 1
        reason: Stable bar path, retains high loading, less shoulder stabilization.
      - exercise_id: dumbbell_bench_press
        rank: 2
        reason: Greater range of motion and shoulder freedom, slightly lower absolute load.
      - exercise_id: cable_chest_press
        rank: 3
        reason: Constant tension, lower absolute load.
      - exercise_id: push_up
        rank: 4
        reason: Bodyweight, easy to scale with volume.

  incline_barbell_bench_press:
