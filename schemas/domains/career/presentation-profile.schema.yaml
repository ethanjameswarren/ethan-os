$schema: "https://json-schema.org/draft/2020-12/schema"
title: Career Presentation Profile
type: object
allOf:
  - $ref: "../../core/object.schema.yaml"
required:
  - id
  - schema
  - schema_version
  - title
  - created_at
  - provenance
properties:
  positioning:
    type: object
    properties:
      primary:
        type: array
        items:
          type: string
      secondary:
        type: array
        items:
          type: string
      target_seniority:
        type: string
      notes:
        type: string
  linkedin:
    type: object
    properties:
      headline:
        type: object
        properties:
          primary:
            type: string
          technical:
            type: string
          leadership:
            type: string
      about:
        type: string
      experience:
        type: array
        items:
          type: object
          properties:
            role_id:
              type: string
            role:
              type: string
            employer:
              type: string
            timeframe:
              type: string
            summary:
              type: string
            bullets:
              type: array
              items:
                type: string
      projects:
        type: array
        items:
          type: object
          properties:
            title:
              type: string
            employer:
              type: string
            description:
              type: string
            technologies:
              type: array
              items:
                type: string
      skills:
        type: object
        properties:
          capabilities:
            type: array
            items:
              type: string
          technologies:
            type: array
            items:
              type: string
          methodologies:
            type: array
            items:
              type: string
          domains:
            type: array
            items:
              type: string
      featured_recommendations:
        type: array
        items:
          type: string
  indeed:
    type: object
    properties:
      summary:
        type: string
      experience:
        type: array
        items:
          type: object
          properties:
            role_id:
              type: string
            role:
              type: string
            employer:
              type: string
            timeframe:
              type: string
            summary:
              type: string
            bullets:
              type: array
              items:
                type: string
      skills:
        type: object
        properties:
          technical:
            type: array
            items:
              type: string
          methodologies:
            type: array
            items:
              type: string
          domains:
            type: array
            items:
              type: string
          capabilities:
            type: array
            items:
              type: string
  resume:
    type: object
    properties:
      default_version:
        type: string
      versions:
        type: array
        items:
          type: string
  cover_letter:
    type: object
    properties:
      generation_mode:
        type: string
        enum:
          - job_targeted
          - general
      recent_letters:
        type: array
        items:
          type: string
  last_generated:
    type: object
    additionalProperties:
      type: string
      format: date
    description: ISO 8601 dates keyed by platform section.
  links:
    type: array
    items:
      $ref: "../../core/relationship.schema.yaml"
  provenance:
    $ref: "../../core/provenance.schema.yaml"
