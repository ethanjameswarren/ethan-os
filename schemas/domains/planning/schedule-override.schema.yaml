$schema: "https://json-schema.org/draft/2020-12/schema"
title: Planning Schedule Override
type: object
allOf:
  - $ref: "../../core/object.schema.yaml"
required:
  - id
  - schema
  - schema_version
  - title
  - status
  - created_at
  - provenance
  - scope
  - change
properties:
  status:
    type: string
    enum:
      - active
      - superseded
      - dropped
  scope:
    type: string
    enum:
      - one_off
      - temporary
      - permanent
    description: |
      one_off = single occurrence only;
      temporary = applies between start_date and end_date;
      permanent = becomes part of the baseline schedule.
  start_date:
    type: string
    format: date
    description: Effective date for one_off or temporary overrides.
  end_date:
    type: string
    format: date
    description: Required for temporary overrides.
  day_of_week:
    type: string
    enum:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
    description: Day of week for permanent overrides or overrides that repeat weekly.
  target_block:
    type: object
    description: The planned block this override modifies, replaces, or cancels, if any.
    properties:
      label:
        type: string
      day_of_week:
        type: string
      start_time:
        type: string
        pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
      end_time:
        type: string
        pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
      category:
        type: string
        enum:
          - fixed
          - flexible
          - recovery
      source:
        type: string
        enum:
          - baseline
          - goal
          - override
          - manual
          - calendar
      notes:
        type: string
  change:
    type: string
    enum:
      - add
      - remove
      - modify
      - swap
  block:
    type: object
    description: The actual block that replaced or was added through the override.
    properties:
      label:
        type: string
      day_of_week:
        type: string
      start_time:
        type: string
        pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
      end_time:
        type: string
        pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
      category:
        type: string
        enum:
          - fixed
          - flexible
          - recovery
      source:
        type: string
        enum:
          - baseline
          - goal
          - override
          - manual
          - calendar
      notes:
        type: string
  change_effect:
    type: string
    enum:
      - moved
      - shortened
      - extended
      - replaced
      - cancelled
      - added
    description: |
      Inferred effect of the override on the original block.
      - moved: same activity at a different time
      - shortened: same activity with a shorter duration
      - extended: same activity with a longer duration
      - replaced: the original activity changed to a different one
      - cancelled: the original activity was removed
      - added: a new activity that did not exist in the plan
  classification:
    type: string
    enum:
      - exception
      - preference
      - friction
      - unknown
    description: |
      Whether the override is an exceptional circumstance, an emerging preference,
      or evidence that the baseline is poorly calibrated.
  classification_reason:
    type: string
    description: Brief justification for the classification.
  reason_category:
    type: string
    enum:
      - unusual_event
      - travel
      - appointment
      - concert
      - sporting_event
      - illness
      - family
      - work
      - preference
      - friction
      - other
      - unknown
    description: Free-text or pre-set reason for the override.
  user_note:
    type: string
    description: Optional free-form note from the user.
  reason:
    type: string
    description: Why the override exists, used for diagnosis and review.
