$schema: "https://json-schema.org/draft/2020-12/schema"
title: Health Medical Note
type: object
allOf:
  - $ref: "../../core/object.schema.yaml"
required:
  - id
  - schema
  - schema_version
  - title
  - note_type
  - date
  - created_at
  - provenance
properties:
  note_type:
    type: string
    enum:
      - appointment
      - diagnosis
      - medication
      - lab_result
      - other
  date:
    type: string
    format: date
  provider:
    type: string
  summary:
    type: string
  follow_up:
    type: string
    description: Any stated follow-up action or next appointment.
  status:
    type: string
    enum:
      - active
      - resolved
      - monitoring
  links:
    type: array
    items:
      $ref: "../../core/relationship.schema.yaml"
  provenance:
    $ref: "../../core/provenance.schema.yaml"
