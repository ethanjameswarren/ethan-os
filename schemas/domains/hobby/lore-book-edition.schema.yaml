$schema: "https://json-schema.org/draft/2020-12/schema"
title: Hobby Lore Book Edition
type: object
allOf:
  - $ref: "../../core/object.schema.yaml"
required:
  - id
  - schema
  - schema_version
  - title
  - created_at
  - provenance
  - edition_year
  - status
properties:
  edition_year:
    type: integer
  subtitle:
    type: string
  edition_status:
    type: string
    enum:
      - draft
      - finalized
      - archived
      - superseded
  generated_date:
    type: string
    format: date
  source_commit:
    type: string
    description: Optional commit hash or snapshot identifier used to render the edition.
  print_status:
    type: string
    enum:
      - digital_only
      - print_ready
      - printed
      - print_ordered
  included_section_ids:
    type: array
    items:
      type: string
  included_lore_ids:
    type: array
    items:
      type: string
  included_media_ids:
    type: array
    items:
      type: string
  included_narrative_ids:
    type: array
    items:
      type: string
  omitted_empty_sections:
    type: array
    items:
      type: string
    description: IDs of sections intentionally omitted because they are empty/TBD.
  visual_gaps:
    type: array
    items:
      type: object
      properties:
        description:
          type: string
        section_id:
          type: string
        media_type:
          type: string
        priority:
          type: string
          enum:
            - required
            - recommended
            - optional
        lore_book_location:
          type: string
          description: Where in the book the asset should appear (e.g., cover, section number, appendix).
        orientation:
          type: string
          enum:
            - landscape
            - portrait
            - square
            - any
        aspect_ratio:
          type: string
          description: Preferred aspect ratio hint (e.g., 1/1, 2/3, 16/9).
        completion_status:
          type: string
          enum:
            - outstanding
            - in_progress
            - supplied
  trim_width_in:
    type: number
    description: Trim width in inches.
  trim_height_in:
    type: number
    description: Trim height in inches.
  safe_margins_in:
    type: array
    items:
      type: number
    minItems: 4
    maxItems: 4
    description: Top, right, bottom, left safe content margins in inches.
  bleed_in:
    type: number
    description: Optional bleed in inches.
  print_vendor:
    type: string
    description: Intended print vendor (e.g., PrintNinja).
  print_production_notes:
    type: string
    description: Vendor-specific production requirements and unresolved print decisions (binding, color profile, cover setup, preflight checklist).
  default_visual_theme:
    type: string
    description: Default theme id (e.g., cyan) for pages without an explicit section theme.
  visual_themes:
    type: object
    additionalProperties:
      type: object
      properties:
        background_media_id:
          type: string
      description: Theme id to configuration map.
    description: Available visual themes and their background media.
  front_matter_order:
    type: array
    items:
      type: string
    description: Order of book sections, including cover, title, toc, body, visual_gaps, appendix.
  renderer_version:
    type: string
    description: Renderer version used to produce the edition.
  output_formats:
    type: array
    items:
      type: string
    description: Rendered output formats (e.g., html, pdf).
  notes:
    type: string
  links:
    type: array
    items:
      $ref: "../../core/relationship.schema.yaml"
  provenance:
    $ref: "../../core/provenance.schema.yaml"
