$schema: "https://json-schema.org/draft/2020-12/schema"
title: Hobby Lore Canon Entry
type: object
allOf:
  - $ref: "../../core/object.schema.yaml"
required:
  - id
  - schema
  - schema_version
  - title
  - created_at
  - provenance
  - lore_type
  - status
  - content
properties:
  lore_type:
    type: string
    enum:
      - identity
      - history
      - philosophy
      - doctrine
      - organization
      - character
      - unit
      - technology
      - faction_relations
      - territory
      - culture
      - visual_language
      - other
  status:
    type: string
    enum:
      - locked
      - developing
      - provisional
      - TBD
      - deprecated
      - contradicted
  content:
    type: string
  source_battle_ids:
    type: array
    items:
      type: string
  source_session_ids:
    type: array
    items:
      type: string
  source_collection_item_ids:
    type: array
    items:
      type: string
  derived_from_candidate_ids:
    type: array
    items:
      type: string
  deprecated_reason:
    type: string
  links:
    type: array
    items:
      $ref: "../../core/relationship.schema.yaml"
  provenance:
    $ref: "../../core/provenance.schema.yaml"
